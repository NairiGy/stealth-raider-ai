<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Машина состояний рейдера</title>
  <desc>Спокоен: Patrol и Return. Настороже: Suspicious и Search. Справа Combat. Из любого живого состояния — Surrender или Dead. Подписи на стрелках — условия переходов.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C9C2B4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7FA866" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .lbl { font-size: 12px; fill: #B5AE9F; }
      .ttl { font-size: 14px; font-weight: 600; }
      .st  { font-size: 14px; font-weight: 600; fill: #E5E0D4; }
      .ln  { stroke: #C9C2B4; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <!-- Card in the game's HUD colours, so it reads on light and dark pages alike. -->
  <rect x="0" y="0" width="680" height="550" rx="14" fill="#171413"/>

  <!-- Every living state: the frame Surrender and Dead are reached from. -->
  <rect x="8" y="10" width="664" height="414" rx="12" fill="none" stroke="#8C8578" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="lbl" x="24" y="31">любое живое состояние</text>

  <!-- Calm -> Combat: wounded while calm. Runs above the alert group. -->
  <path class="ln" d="M140 59 V46 H600 V187" marker-end="url(#a)"/>
  <text class="lbl" x="420" y="41" text-anchor="middle">ранен</text>

  <g transform="translate(0,20)">
    <!-- Groups -->
    <rect x="20" y="40" width="150" height="300" rx="12" fill="#22201D" stroke="#8C8578" stroke-width="1"/>
    <text class="ttl" x="95" y="68" text-anchor="middle" fill="#E5E0D4">Спокоен</text>
    <rect x="280" y="40" width="150" height="300" rx="12" fill="#2A2218" stroke="#EBA138" stroke-width="1"/>
    <text class="ttl" x="355" y="68" text-anchor="middle" fill="#EBA138">Настороже</text>

    <!-- States -->
    <rect x="40" y="90" width="110" height="40" rx="8" fill="#171413" stroke="#E5E0D4" stroke-width="1"/>
    <text class="st" x="95" y="115" text-anchor="middle">Patrol</text>
    <rect x="40" y="250" width="110" height="40" rx="8" fill="#171413" stroke="#8C8578" stroke-width="1"/>
    <text class="st" x="95" y="275" text-anchor="middle">Return</text>
    <rect x="300" y="90" width="110" height="40" rx="8" fill="#171413" stroke="#EBA138" stroke-width="1"/>
    <text class="st" x="355" y="115" text-anchor="middle">Suspicious</text>
    <rect x="300" y="250" width="110" height="40" rx="8" fill="#171413" stroke="#D9772B" stroke-width="1"/>
    <text class="st" x="355" y="275" text-anchor="middle">Search</text>
    <rect x="545" y="170" width="110" height="40" rx="8" fill="#3A1A15" stroke="#D63D2B" stroke-width="1.2"/>
    <text class="st" x="600" y="195" text-anchor="middle">Combat</text>


    <!-- Return -> Patrol -->
    <line class="ln" x1="95" y1="249" x2="95" y2="133" marker-end="url(#a)"/>
    <text class="lbl" x="104" y="186">дошёл до</text>
    <text class="lbl" x="104" y="201">маршрута</text>

    <!-- Calm -> Suspicious -->
    <line class="ln" x1="171" y1="112" x2="297" y2="112" marker-end="url(#a)"/>
    <text class="lbl" x="225" y="84" text-anchor="middle">видит героя,</text>
    <text class="lbl" x="225" y="99" text-anchor="middle">шкала ≥ 0,3</text>

    <!-- Calm -> Search -->
    <line class="ln" x1="171" y1="262" x2="297" y2="262" marker-end="url(#a)"/>
    <text class="lbl" x="225" y="254" text-anchor="middle">выстрел</text>

    <!-- Search -> Return -->
    <line class="ln" x1="299" y1="280" x2="153" y2="280" marker-end="url(#a)"/>
    <text class="lbl" x="225" y="300" text-anchor="middle">12 с без</text>
    <text class="lbl" x="225" y="315" text-anchor="middle">находок</text>

    <!-- Suspicious -> Search -->
    <line class="ln" x1="355" y1="131" x2="355" y2="247" marker-end="url(#a)"/>
    <text class="lbl" x="364" y="178">пропал из</text>
    <text class="lbl" x="364" y="193">виду или</text>
    <text class="lbl" x="364" y="208">выстрел</text>

    <!-- Search -> Search: a new shot restarts the search at the new spot -->
    <path class="ln" d="M338 291 C338 318, 372 318, 372 294" marker-end="url(#a)"/>
    <text class="lbl" x="355" y="332" text-anchor="middle">новый выстрел</text>

    <!-- Alert -> Combat -->
    <line class="ln" x1="431" y1="190" x2="542" y2="190" marker-end="url(#a)"/>
    <text class="lbl" x="487" y="164" text-anchor="middle">шкала заполнена</text>
    <text class="lbl" x="487" y="179" text-anchor="middle">или ранен</text>

    <!-- Combat -> Search -->
    <path class="ln" d="M590 211 V276 H413" marker-end="url(#a)"/>
    <text class="lbl" x="490" y="296" text-anchor="middle">не видит 3 с</text>

    <!-- Combat -> Return -->
    <path class="ln" d="M625 211 V372 H95 V293" marker-end="url(#a)"/>
    <text class="lbl" x="360" y="394" text-anchor="middle">герой погиб</text>
  </g>

  <!-- Any living state -> Surrender -->
  <line class="ln" x1="265" y1="425" x2="265" y2="477" marker-end="url(#a)"/>
  <text class="lbl" x="274" y="446">остался один,</text>
  <text class="lbl" x="274" y="461">здоровье ≤ 35 %</text>
  <rect x="200" y="480" width="130" height="40" rx="8" fill="#171413" stroke="#E5E0D4" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="st" x="265" y="505" text-anchor="middle">Surrender</text>

  <!-- Any living state -> Dead -->
  <line class="ln" x1="525" y1="425" x2="525" y2="477" marker-end="url(#a)"/>
  <text class="lbl" x="534" y="454">убит</text>
  <rect x="470" y="480" width="110" height="40" rx="8" fill="#22201D" stroke="#5F5B56" stroke-width="1"/>
  <text class="st" x="525" y="505" text-anchor="middle" fill="#8C8578">Dead</text>

  <!-- Surrender -> Dead -->
  <line class="ln" x1="331" y1="500" x2="467" y2="500" marker-end="url(#a)"/>
  <text class="lbl" x="399" y="492" text-anchor="middle">застрелен</text>

  <!-- Start: a raider begins in Patrol. Drawn last so it sits on top of the calm group. -->
  <circle cx="50" cy="47" r="5" fill="#7FA866"/>
  <text x="61" y="51" font-size="12" font-weight="600" fill="#7FA866">старт</text>
  <line x1="50" y1="53" x2="50" y2="107" stroke="#7FA866" stroke-width="1.4" marker-end="url(#s)"/>
</svg>
